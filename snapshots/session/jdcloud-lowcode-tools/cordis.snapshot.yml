# Keyless replay keeps both JDCloud Host plugins real and replaces only the
# external model adapter. A headless prompt has no browser rpcId, so it does
# not trigger the authenticated current-user refresh.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash

    - id: jdcloud-auth-controller
      name: '@deepseek-ai/dsh-api-jdcloud-auth-controller'

    - id: tool-jdcloud-lowcode
      name: '@deepseek-ai/dsh-tool-jdcloud-lowcode'
