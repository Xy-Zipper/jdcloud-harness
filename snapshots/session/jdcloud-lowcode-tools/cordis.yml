# Product-shaped JDCloud composition for recording the model-visible low-code
# guidance and tool schemas without making a JDCloud request.
- id: credentials
  disabled: false
- insert:
    - id: jdcloud-auth-controller
      name: '@deepseek-ai/dsh-api-jdcloud-auth-controller'

    - id: tool-jdcloud-lowcode
      name: '@deepseek-ai/dsh-tool-jdcloud-lowcode'

    # Keep the low-code schema fixture portable across Windows and POSIX hosts.
    - id: jdcloud-portable-context
      name: '../../../packages/jdcloud/creation-studio-media/tests/fixtures/portable-context.ts'
