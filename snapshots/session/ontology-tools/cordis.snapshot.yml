# Keyless replay keeps the real Ontology tools and replaces external services
# with deterministic in-process providers.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

# Runtime-only tools never launch a process; omit platform-specific sandbox Skills.
- id: sandbox
  config:
    runnerCommand: [ontology-snapshot-no-process]
    runnerFailureSignatures: [ontology-snapshot-no-process]

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: ontology-runtime-fixture
      name: './ontology-runtime-fixture.mjs'

    - id: tool-ontology
      name: '../../../packages/ontology/tool-ontology/src/index.ts'
