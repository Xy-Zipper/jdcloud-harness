- id: credentials
  disabled: false
# Media tools load through the shipped profile without making provider or platform requests.
- insert:
    - id: jdcloud-auth-controller
      name: '@deepseek-ai/dsh-api-jdcloud-auth-controller'
    - id: media-test-webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: 0
    - id: creation-studio-media
      name: '@deepseek-ai/dsh-creation-studio-media'
      config:
        platformURL: https://mi.kindoucloud.com
        tenantId: 6ad80f2f1f280486bb45ac3a
        stateDirectory: !!js "process.env.DSH_HOME + '/creation-studio-media'"
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    watch: false
- insert:
    - id: media-portable-context
      name: '../../../packages/jdcloud/creation-studio-media/tests/fixtures/portable-context.ts'
- id: tool-skill
  disabled: true
