# JDCloud sessions retain the deployment's permission default while tenant controls stay restricted.
- id: jdcloud-auth-controller
  config:
    userWorkspaceDirectory: !!js process.getBuiltinModule('node:path').join(process.cwd(), '.jdcloud-users')
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    scopedUserWorkspaceDir: !!js process.getBuiltinModule('node:path').join(process.cwd(), '.jdcloud-users')
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: never
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
