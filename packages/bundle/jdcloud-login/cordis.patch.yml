# Optional Web-profile layer for JDCloud low-code authentication.
- id: connection
  config:
    # JDCloud owns application login, so each browser gets its own opaque
    # Host session instead of sharing Harness authentication state.
    browserAuthentication: false
    browserSession: true
    browserSessionTransport: bearer
    trustedHosts: !!js ctx.webRuntime.trustedHosts

# JDCloud workspaces stay inside the authenticated user's private directory.
# The in-app browser starts at that directory and cannot navigate above it.
- id: directory-picker
  disabled: true

# Account skills are discovered on the Host plane because preset-local
# providers do not know the JDCloud user workspace parent.
- id: skill-filesystem
  disabled: false
  config:
    includeDefaultRoots: false
    scopedUserWorkspaceDir: !!js process.env.JDCLOUD_USER_WORKSPACE_DIR ?? process.getBuiltinModule('node:path').join(process.env.DSH_HOME ?? process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.dsh'), 'account-workspaces')

- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

    - id: jdcloud-auth-controller
      name: '@deepseek-ai/dsh-api-jdcloud-auth-controller'
      config:
        defaultBaseUrl: !!js process.env.JDCLOUD_DEFAULT_BASE_URL
        requestTimeoutMs: 15000
        userWorkspaceDirectory: !!js process.env.JDCLOUD_USER_WORKSPACE_DIR

    # External callers authenticate with the raw JDCloud token and current tenant id.
    - id: external-api
      name: '@deepseek-ai/dsh-api-external'

    - id: tool-jdcloud-lowcode
      name: '@deepseek-ai/dsh-tool-jdcloud-lowcode'

    - id: ui-jdcloud-login
      name: '@deepseek-ai/dsh-client-ui-jdcloud-login'
      config:
        transferFrameAncestorOrigin: !!js process.env.JDCLOUD_IFRAME_PARENT_ORIGIN

    - id: ui-jdcloud-lowcode-actions
      name: '@deepseek-ai/dsh-client-ui-jdcloud-lowcode-actions'

- id: ui-settings-models
  config:
    welcomeNotice: false
    credentialOnboarding: false
