# Optional Web-profile layer for Ontology Runtime authentication.
- id: connection
  config:
    # Ontology owns application login, so each browser gets its own opaque
    # Host session instead of sharing Harness authentication state.
    browserAuthentication: false
    browserSession: true
    browserSessionTransport: bearer
    trustedHosts: !!js ctx.webRuntime.trustedHosts

- id: directory-picker
  disabled: true

- insert:
    # Ontology workspaces stay inside the authenticated user's private root, so
    # the browser picker starts there and never exposes host directories above it.
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

    - id: ontology-auth-controller
      name: '@deepseek-ai/dsh-api-ontology-auth-controller'
      config:
        ontologyBaseUrl: !!js process.env.ONTOLOGY_BASE_URL
        requestTimeoutMs: !!js Number(process.env.ONTOLOGY_REQUEST_TIMEOUT_MS ?? 15000)
        allowInsecureLoopback: !!js process.env.ONTOLOGY_ALLOW_INSECURE_LOOPBACK === 'true'
        userWorkspaceDirectory: !!js process.env.ONTOLOGY_USER_WORKSPACE_DIR

    - id: tool-ontology
      name: '@deepseek-ai/dsh-tool-ontology'

    - id: ui-ontology-login
      name: '@deepseek-ai/dsh-client-ui-ontology-login'

- id: ui-settings-models
  config:
    welcomeNotice: false
    credentialOnboarding: false
